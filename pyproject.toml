[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "allods2"
version = "0.1.0"
description = "Allods 2 / Rage of Mages 2 recreation: data formats and game layer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
game = ["pygame>=2.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["allods2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
